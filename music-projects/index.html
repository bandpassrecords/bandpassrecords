<!DOCTYPE html>
<html lang="en" data-base="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Before anything paints: the palette and language picked earlier in this
    // browser. ?palette=classic and ?lang=pt pick one by link, and are remembered.
    (function () {
      var root = document.documentElement;
      try {
        var q = new URLSearchParams(location.search);
        var palette = q.get('palette') || localStorage.getItem('bpr-palette');
        if (palette === 'neon' || palette === 'classic') {
          root.dataset.palette = palette;
          localStorage.setItem('bpr-palette', palette);
        }
        var lang = q.get('lang') || localStorage.getItem('bpr-lang');
        if (lang) root.lang = lang;
      } catch (e) {}
    })();
  </script>
  <title>Music projects · BandPass Records</title>
  <meta name="description" content="Software for producers and labels from BandPass Records: DAW Project Manager, flatQ, Spinclip and more.">
  <meta name="theme-color" content="#0A0A14">
  <link rel="canonical" href="https://bandpassrecords.com/music-projects/">
  <link rel="alternate" hreflang="en" href="https://bandpassrecords.com/music-projects/?lang=en">
  <link rel="alternate" hreflang="pt" href="https://bandpassrecords.com/music-projects/?lang=pt">
  <link rel="alternate" hreflang="es" href="https://bandpassrecords.com/music-projects/?lang=es">
  <link rel="alternate" hreflang="x-default" href="https://bandpassrecords.com/music-projects/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BandPass Records">
  <meta property="og:title" content="Music projects · BandPass Records">
  <meta property="og:description" content="Software for producers and labels from BandPass Records: DAW Project Manager, flatQ, Spinclip and more.">
  <meta property="og:url" content="https://bandpassrecords.com/music-projects/">
  <meta property="og:image" content="https://bandpassrecords.com/images/releases/beyond-the-surface.jpg">
  <meta name="twitter:card" content="summary">

  <link rel="icon" href="../images/logo.svg" type="image/svg+xml">
  <link rel="icon" href="../images/logo_icon.png" type="image/png">
  <link rel="apple-touch-icon" href="../images/logo_icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/site.css">

  <script src="../assets/js/i18n.js" defer></script>
  <script src="../assets/js/icons.js" defer></script>
  <script src="../assets/js/data.js" defer></script>
  <script src="../assets/js/site.js" defer></script>
</head>
<body data-page="music">
  <a class="skip" href="#content" data-i18n="skip">Skip to content</a>

  <nav class="navbar" data-i18n-attr="aria-label:nav.sections" aria-label="Sections">
    <div class="container nav-content">
      <a class="logo" href="../">
        <img class="logo-image" src="../images/logo.svg" alt="" width="32" height="32">
        <span>BandPass Records</span>
      </a>
      <div class="nav-links">
        <a href="../discography/" data-i18n="nav.discography">Discography</a>
        <a href="../music-projects/" data-i18n="nav.music" aria-current="page">Music projects</a>
        <a href="../other-projects/" data-i18n="nav.other">Other projects</a>
        <a href="../#contact" data-i18n="nav.contact">Contact</a>
      </div>
      <div class="lang-switch" role="group" data-i18n-attr="aria-label:lang.label" aria-label="Language">
        <button type="button" data-lang-choice="en" lang="en" title="English">EN</button>
        <button type="button" data-lang-choice="pt" lang="pt" title="Português">PT</button>
        <button type="button" data-lang-choice="es" lang="es" title="Español">ES</button>
      </div>
    </div>
  </nav>

  <header class="hero hero--page">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="container hero-content">
      <p class="section-eyebrow" data-i18n="music.eyebrow">Studio</p>
      <h1 class="page-title" data-i18n="music.title">Music projects</h1>
      <p class="hero-subtitle" data-i18n="music.sub">Software for producers and labels: free, mostly open source, built for the way we work.</p>
    </div>
  </header>

  <main id="content" class="section section--flush">
    <div class="container">
      <div data-projects="music"></div>
      <noscript>
        <p class="noscript">See every project on <a href="https://github.com/bandpassrecords">GitHub</a>.</p>
      </noscript>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <p>© <span id="year">2026</span> BandPass Records · <a class="footer-mail" href="mailto:info@bandpassrecords.com">info@bandpassrecords.com</a></p>
      <ul class="social" id="social" data-i18n-attr="aria-label:footer.elsewhere" aria-label="BandPass Records elsewhere"></ul>
    </div>
  </footer>

  <div class="palette-switch" role="group" data-i18n-attr="aria-label:palette.label" aria-label="Palette">
    <span data-i18n="palette.label">Palette</span>
    <button type="button" data-palette-choice="neon">Neon</button>
    <button type="button" data-palette-choice="classic">Classic</button>
  </div>
</body>
</html>
